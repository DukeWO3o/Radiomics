name: rmpp-app
channels:
  - radiomics
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.7.1
  - numpy=1.21.6
  - pandas=1.3.5
  - scikit-learn=1.0.2
  - joblib=1.1.1
  - plotly=5.9.0
  # conda-forge 的 simpleitk 2.1.1.1 在本机无法 import，实际用下面 pip 段固定的 2.0.0
  - SimpleITK
  - xgboost=1.5.1
  - lightgbm=3.2.1
  - pyradiomics=3.1.0a2
  - pydicom=2.4.4
  - pip=22.3.1
  - pip:
    # pip options must precede the packages they apply to
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch==1.13.1+cpu
    - opencv-python==4.12.0.88
    - streamlit==1.23.1
    # urllib3 2.x cannot import on this Python 3.7 build (OpenSSL 1.1.0i)
    - urllib3==1.26.20
    # PyPI build required: it matches the training env and loads correctly here
    - SimpleITK==2.0.0
    # not needed by the app:
    # - torchvision==0.14.1+cpu
    # - torchaudio==0.13.1
